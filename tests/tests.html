<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tests — appli Notes</title>
  <style>
    body { font-family: Segoe UI, system-ui, sans-serif; margin: 2rem; color: #222; }
    h1 { font-size: 1.3rem; margin-bottom: .3rem; }
    #summary { font-weight: 600; padding: .5rem .8rem; border-radius: 6px; display: inline-block; }
    #summary.ok   { background: #e3f6e8; color: #17652e; }
    #summary.fail { background: #fde4e4; color: #9b1c1c; }
    ul { list-style: none; padding: 0; margin-top: 1rem; }
    li { padding: .25rem 0; font-size: .92rem; }
    li.pass::before { content: "✔ "; color: #17652e; }
    li.fail::before { content: "✘ "; color: #9b1c1c; }
    li.fail { color: #9b1c1c; }
    .err { display: block; margin-left: 1.3rem; font-family: Consolas, monospace; font-size: .82rem; }
    h2 { font-size: 1rem; margin: 1.2rem 0 .2rem; color: #555; }
  </style>
</head>
<body>
  <h1>Tests — appli Notes</h1>
  <div id="summary">En cours…</div>
  <div id="results"></div>

  <script src="../js/workdays.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/ephemeris.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/filesync.js"></script>
  <script src="tests.js"></script>
</body>
</html>
