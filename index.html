<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Hors ligne garanti : le navigateur refuse toute connexion extérieure (aucun serveur,
       aucun CDN, aucune police ou image distante). Seuls les fichiers du dossier sont chargés. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Notes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="app-title">Notes</h1>
    <div class="search">
      <input id="search" type="search" placeholder="Rechercher  ( / )" aria-label="Rechercher dans les notes" autocomplete="off">
    </div>
    <button id="btn-new-note" class="btn-primary" type="button">+ Nouvelle note</button>
    <div class="menu-wrap">
      <button id="btn-menu" class="btn-icon" type="button" title="Plus d'options"
              aria-label="Plus d'options" aria-haspopup="menu" aria-expanded="false">⋮</button>
      <div id="menu" class="menu" role="menu" hidden>
        <button type="button" class="menu-item" role="menuitem" data-action="export">Exporter les notes (JSON)</button>
        <button type="button" class="menu-item" role="menuitem" data-action="import">Importer une sauvegarde…</button>
        <div class="menu-section">
          <div class="menu-label" id="size-label">Taille des stickers</div>
          <div class="size-picker" role="radiogroup" aria-labelledby="size-label">
            <button type="button" class="size-opt" role="radio" data-size="small">Petit</button>
            <button type="button" class="size-opt" role="radio" data-size="medium">Moyen</button>
            <button type="button" class="size-opt" role="radio" data-size="large">Grand</button>
          </div>
        </div>
        <div id="menu-info" class="menu-info"></div>
      </div>
    </div>
    <input id="file-import" type="file" accept=".json,application/json" hidden>
  </header>

  <div class="layout">
    <main class="content">
      <div id="backup-reminder" class="banner banner-reminder" hidden>
        <span class="reminder-text"></span>
        <button type="button" class="banner-btn" data-action="export">Exporter maintenant</button>
        <button type="button" class="banner-btn banner-btn-muted" data-action="snooze">Plus tard</button>
      </div>
      <div id="banner" class="banner" hidden></div>
      <div id="filters" class="filters" role="toolbar" aria-label="Filtrer par étiquette" hidden></div>
      <p id="empty-state" class="empty-state" hidden>Aucune note pour l'instant.<br>Clique sur « + Nouvelle note » pour commencer.</p>
      <div id="grid" class="grid"></div>
    </main>

    <!-- Colonne de droite : encart date / heure / éphéméride (clock.js)
         puis toutes les tâches à délai (panel.js) -->
    <aside class="panel">
      <section id="clock" class="clock" aria-label="Date, heure et éphéméride"></section>
      <div id="panel" aria-label="Tâches de toutes les cartes"></div>
    </aside>
  </div>

  <!-- Modal d'édition : rempli par editor.js -->
  <div id="overlay" class="overlay" hidden></div>

  <!-- Scripts classiques (pas de modules ES : bloqués en file://). L'ordre compte. -->
  <script src="js/workdays.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ephemeris.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
